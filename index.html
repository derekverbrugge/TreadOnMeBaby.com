<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Tread On Me Baby — coming soon.">
  <title>Tread On Me Baby — Coming Soon</title>
  <style>
    :root {
      --yellow: #f5c400;
      --yellow-bright: #ffd83d;
      --dark: #202124;
      --darkest: #121315;
      --text: #f4f4f0;
      --muted: #b8b8b2;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--darkest);
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--text);
      background:
        linear-gradient(rgba(18, 19, 21, 0.88), rgba(18, 19, 21, 0.96)),
        repeating-linear-gradient(
          -45deg,
          transparent 0,
          transparent 18px,
          rgba(245, 196, 0, 0.035) 18px,
          rgba(245, 196, 0, 0.035) 20px
        ),
        var(--darkest);
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      width: min(100%, 980px);
      min-height: min(720px, calc(100vh - 48px));
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(28px, 6vw, 64px);
      border: 1px solid #414247;
      background: rgba(32, 33, 36, 0.94);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
      position: relative;
      overflow: hidden;
    }

    .page::before {
      content: "";
      position: absolute;
      inset: 0;
      height: 8px;
      background: var(--yellow);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: var(--yellow-bright);
      font-size: clamp(0.78rem, 1.8vw, 1rem);
      font-weight: 800;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .brand-mark {
      width: 14px;
      height: 14px;
      background: var(--yellow);
      transform: rotate(45deg);
      flex: 0 0 auto;
    }

    main {
      max-width: 720px;
      margin: auto 0;
      padding: 72px 0;
    }

    .eyebrow {
      margin: 0 0 18px;
      color: var(--yellow-bright);
      font-size: clamp(0.78rem, 1.8vw, 0.95rem);
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 780px;
      margin: 0;
      color: var(--text);
      font-size: clamp(3.2rem, 10vw, 7.5rem);
      line-height: 0.9;
      letter-spacing: -0.075em;
      text-transform: uppercase;
    }

    h1 span {
      color: var(--yellow);
      display: block;
    }

    .intro {
      max-width: 560px;
      margin: 30px 0 0;
      color: var(--muted);
      font-size: clamp(1rem, 2.4vw, 1.25rem);
      line-height: 1.65;
    }

    .rule {
      width: 100%;
      height: 1px;
      margin: 38px 0 24px;
      background: #4a4b4f;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--yellow);
      box-shadow: 0 0 0 5px rgba(245, 196, 0, 0.12);
    }

    footer {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 16px;
      color: #85868a;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    footer strong {
      color: var(--yellow);
      font-weight: 800;
    }

    @media (max-width: 560px) {
      body {
        padding: 12px;
      }

      .page {
        min-height: calc(100vh - 24px);
        padding: 34px 24px 24px;
      }

      main {
        padding: 56px 0;
      }

      h1 {
        font-size: clamp(3rem, 16vw, 5.5rem);
      }

      .intro {
        line-height: 1.55;
      }

      footer {
        flex-direction: column;
        gap: 8px;
      }
    }

    @media (prefers-reduced-motion: no-preference) {
      .status-dot {
        animation: pulse 2s ease-in-out infinite;
      }

      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.45; }
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="brand" aria-label="Tread On Me Baby">
      <span class="brand-mark" aria-hidden="true"></span>
      TreadOnMeBaby.com
    </header>

    <main>
      <p class="eyebrow">Something is treading in...</p>
      <h1>Coming <span>Soon.</span></h1>
      <p class="intro">
        A new destination.
      </p>

      <div class="rule"></div>

      <div class="status">
        <span class="status-dot" aria-hidden="true"></span>
        Website under construction
      </div>
    </main>

    <footer>
      <span><strong>treadonmebaby.com</strong></span>
      <span>Built for you.</span>
    </footer>
  </div>
</body>
</html>
